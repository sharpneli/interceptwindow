<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Ship Style Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: the 3D view is the screen; a ship rail, a tool strip and a spec card float over it (same rule as the UI mockups). */
:root{
  color-scheme:dark;
  --bg:#0b0e11; --plate:rgba(13,17,21,.82); --line:#2a323b; --line-strong:#3d4853;
  --fg:#e3e7ea; --dim:#aab3bc; --mute:#77828d; --accent:#5cb8e6; --warn:#e0a040;
  --sans:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.4;overflow:hidden;position:relative}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.hud{position:absolute;inset:0;display:grid;grid-template-columns:232px 1fr 300px;grid-template-rows:auto 1fr auto;gap:12px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud>*{pointer-events:auto;min-width:0}
.plate{background:var(--plate);border:1px solid var(--line);backdrop-filter:blur(6px)}
.cap{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:500}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.rail{grid-column:1;grid-row:1/4;align-self:start;display:flex;flex-direction:column}
.rail h1{font-size:15px;font-weight:600;margin:0;padding:10px 12px 2px;letter-spacing:.02em}
.rail .sub{padding:0 12px 10px;color:var(--mute);font-size:12px;border-bottom:1px solid var(--line)}
.era{padding:9px 12px 4px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.era b{font-weight:500;color:var(--dim);font-size:12px}
.ship{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;
  color:var(--fg);font:inherit;padding:6px 12px 6px 10px;cursor:pointer}
.ship span:last-child{color:var(--mute);font-size:11px;white-space:nowrap}
.ship:hover{background:rgba(92,184,230,.07)}
.ship[aria-pressed="true"]{border-left-color:var(--accent);background:rgba(92,184,230,.12)}
.ship:focus-visible,.tog:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
.rail .foot{border-top:1px solid var(--line);margin-top:6px;padding:8px 12px;color:var(--mute);font-size:11.5px}

.tools{grid-column:2/4;grid-row:1;justify-self:end;display:flex;flex-wrap:wrap;justify-content:flex-end}
.tog{background:none;border:0;border-right:1px solid var(--line);color:var(--dim);font:inherit;font-size:12px;padding:6px 11px;cursor:pointer}
.tog:last-child{border-right:0}
.tog:hover{color:var(--fg)}
.tog[aria-pressed="true"]{color:var(--accent);background:rgba(92,184,230,.1)}

.card{grid-column:3;grid-row:3;padding:12px 14px;overflow:auto;max-height:100%}
.card h2{margin:2px 0 0;font-size:19px;font-weight:600;letter-spacing:.01em;text-wrap:balance}
.card .cls{color:var(--dim);margin-bottom:9px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 9px;padding:8px 0;border-block:1px solid var(--line)}
.card dt{color:var(--mute);font-size:11.5px}
.card dd{margin:0;text-align:right;font-size:11.5px}
.card p{margin:0;color:var(--dim);font-size:12.5px}
.card p+p{margin-top:6px}
.card .new{color:var(--warn)}

.scale{grid-column:2;grid-row:3;justify-self:center;align-self:end;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;color:var(--dim);font-size:11px}
.scale i{display:block;height:5px;border:1px solid var(--dim);border-top:0}
.tag{position:absolute;left:0;top:0;font-size:11px;color:var(--dim);white-space:nowrap;pointer-events:none;padding-left:8px;border-left:1px solid var(--line-strong)}
.tag b{font-weight:500;color:var(--fg)}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--dim)}

@media (max-width:820px){
  .hud{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto;gap:8px;padding-block:10px}
  .rail{grid-column:1;grid-row:1;flex-direction:row;overflow-x:auto;align-items:stretch}
  .rail h1,.rail .sub,.rail .foot,.era span{display:none}
  .rail .grp{display:flex;align-items:center;border-right:1px solid var(--line);flex:none}
  .era{padding:6px 4px 6px 10px}.era b{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);white-space:nowrap}
  .ship{border-left:0;border-bottom:2px solid transparent;padding:8px 9px;white-space:nowrap;width:auto}
  .ship span:last-child{display:none}
  .ship[aria-pressed="true"]{border-bottom-color:var(--accent)}
  .tools{grid-column:1;grid-row:2;justify-self:start}
  .scale{grid-column:1;grid-row:4}
  .card{grid-column:1;grid-row:5;max-height:31vh;padding:10px 12px}
  .card h2{font-size:16px}
}
</style>

<canvas id="stage" aria-label="3D view of the selected ship. Drag to orbit, scroll or pinch to zoom."></canvas>
<div class="hud">
  <nav class="rail plate" id="rail" aria-label="Ships by era">
    <h1>Ship Style Bench</h1>
    <div class="sub">Six hulls, three eras, true scale</div>
  </nav>
  <div class="tools plate" role="group" aria-label="View options">
    <button class="tog" id="t-burn" aria-pressed="false">Drive burning</button>
    <button class="tog" id="t-fill" aria-pressed="false">Fill light</button>
    <button class="tog" id="t-turn" aria-pressed="true">Turntable</button>
    <button class="tog" id="t-line" aria-pressed="false">Line-up</button>
  </div>
  <div class="scale" aria-hidden="true"><i id="bar"></i><span class="mono" id="barlab"></span></div>
  <aside class="card plate" id="card" aria-live="polite"></aside>
</div>
<div id="tags"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div class="err">The 3D library did not load. Check the network connection and reload.</div>');return;}
const T=THREE, PI=Math.PI, V=(x,y,z)=>new T.Vector3(x,y,z);

/* ---------- materials ---------- */
const M=(color,o)=>new T.MeshStandardMaterial(Object.assign({color,roughness:.7,metalness:.08},o||{}));
const hot=(col,k,base)=>M(base||0x1c1614,{emissive:col,emissiveIntensity:k,roughness:.9,side:T.DoubleSide});
const glow=(col,op)=>new T.MeshBasicMaterial({color:col,transparent:true,opacity:op,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide});
const mat={
  white:M(0xd9d8d2,{roughness:.62}), foil:M(0xc39a3e,{roughness:.42,metalness:.3,flatShading:true}),
  silverfoil:M(0x908d85,{roughness:.45,metalness:.25,flatShading:true}),
  alu:M(0x9a9fa5,{roughness:.5,metalness:.3}), dark:M(0x2b2a2a,{roughness:.6,metalness:.2}),
  solar:M(0x121c3c,{roughness:.3,metalness:.4}), black:M(0x0c0c0d,{roughness:.9}),
  navy:M(0x7b8188,{roughness:.7,flatShading:true}), armour:M(0x676c72,{roughness:.74,metalness:.15}),
  armourF:M(0x60656b,{roughness:.74,metalness:.15,flatShading:true}), belt:M(0x4b5056,{roughness:.6,metalness:.25,flatShading:true}),
  steel:M(0x4a4e53,{roughness:.55,metalness:.3}), ochre:M(0xb98a2c,{roughness:.8}), rubber:M(0x1a1a1c,{roughness:.95}),
  liner:M(0xb3b6ba,{roughness:.55}), ceramic:M(0x24272c,{roughness:.48,metalness:.2,flatShading:true}),
  mirror:M(0xd2d8de,{roughness:.12,metalness:.35}), coil:M(0xaeb4ba,{roughness:.5,metalness:.2}),
  r600:hot(0xff2200,.035,0x34363a), r1000:hot(0xff3408,.55), r1500:hot(0xff6a1a,1.25), r2500:hot(0xffc27a,2.3)
};

const PV=`#include <common>
#include <logdepthbuf_pars_vertex>
varying float vT;varying vec3 vN;varying vec3 vV;
void main(){vT=1.0-uv.y;vN=normalMatrix*normal;vec4 mv=modelViewMatrix*vec4(position,1.0);vV=-mv.xyz;gl_Position=projectionMatrix*mv;
#include <logdepthbuf_vertex>
}`;
const PF=`uniform vec3 col;uniform float I0;uniform float k;uniform float p;
#include <logdepthbuf_pars_fragment>
varying float vT;varying vec3 vN;varying vec3 vV;
void main(){
#include <logdepthbuf_fragment>
float f=pow(abs(dot(normalize(vN),normalize(vV))),1.4);float a=I0/pow(1.0+k*vT,p)*smoothstep(1.0,0.6,vT);gl_FragColor=vec4(col*a*f,1.0);}`;
/* ---------- builder: ships are built along Y, nose at +Y, as in the generator doc ---------- */
function hash(x,y,z){let h=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return h-Math.floor(h);}
function crinkle(geo,amp){const p=geo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
  const k=1+amp*(hash(Math.round(x*8),Math.round(y*8),Math.round(z*8))-.5);p.setXYZ(i,x*k,y,z*k);}geo.computeVertexNormals();return geo;}
class Ship{
  constructor(){this.g=new T.Group();this.plumes=[];this.spin=[];this.bells=[];this.pulse=null;this.cur=this.g;}
  mesh(geo,m,o){const k=new T.Mesh(geo,m);o=o||{};k.castShadow=o.shadow!==false;k.receiveShadow=o.shadow!==false;this.cur.add(k);return k;}
  cyl(m,rAft,rFwd,y0,y1,seg,o){o=o||{};const g=new T.CylinderGeometry(rFwd,rAft,y1-y0,seg||32,o.hs||1,!!o.open);
    if(o.crinkle)crinkle(g,o.crinkle);const k=this.mesh(g,m,o);k.position.set(o.x||0,(y0+y1)/2,o.z||0);return k;}
  sphere(m,r,x,y,z,o){o=o||{};const g=new T.SphereGeometry(r,o.seg||24,o.hs||14);if(o.crinkle)crinkle(g,o.crinkle);
    const k=this.mesh(g,m,o);k.position.set(x,y,z);return k;}
  capsule(m,r,y0,y1,x,z,o){o=Object.assign({x:x||0,z:z||0,hs:5},o||{});const s=o.seg||20;
    this.cyl(m,r,r,y0+r,y1-r,s,o);this.sphere(m,r,o.x,y0+r,o.z,{seg:s,hs:10,crinkle:o.crinkle});this.sphere(m,r,o.x,y1-r,o.z,{seg:s,hs:10,crinkle:o.crinkle});}
  strut(m,a,b,r,o){const d=b.clone().sub(a),L=d.length();const k=this.mesh(new T.CylinderGeometry(r,r,L,6),m,Object.assign({shadow:false},o||{}));
    k.position.copy(a).addScaledVector(d,.5);k.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return k;}
  truss(m,y0,y1,w,bay,r){const c=[0,1,2].map(i=>{const a=PI/2+i*2*PI/3;return [Math.cos(a)*w,Math.sin(a)*w];});
    c.forEach(p=>this.strut(m,V(p[0],y0,p[1]),V(p[0],y1,p[1]),r));
    const n=Math.max(1,Math.round((y1-y0)/bay)),h=(y1-y0)/n;
    for(let i=0;i<=n;i++){const y=y0+i*h;for(let j=0;j<3;j++){const a=c[j],b=c[(j+1)%3];
      this.strut(m,V(a[0],y,a[1]),V(b[0],y,b[1]),r*.7);if(i<n)this.strut(m,V(a[0],y,a[1]),V(b[0],y+h,b[1]),r*.6);}}}
  wing(m,ang,r0,w,y0,y1,t,o){const p=new T.Group();p.rotation.y=ang;this.cur.add(p);const k=new T.Mesh(new T.BoxGeometry(w,y1-y0,t||.15),m);
    k.position.set(r0+w/2,(y0+y1)/2,0);k.castShadow=k.receiveShadow=!(o&&o.shadow===false);p.add(k);return k;}
  box(m,sx,sy,sz,x,y,z,ry){const k=this.mesh(new T.BoxGeometry(sx,sy,sz),m);k.position.set(x,y,z);if(ry)k.rotation.y=ry;return k;}
  onSide(m,ang,rad,y,sx,sy,sz){const p=new T.Group();p.rotation.y=ang;this.cur.add(p);const k=new T.Mesh(new T.BoxGeometry(sx,sy,sz),m);k.position.set(rad,y,0);p.add(k);return k;}
  ring(m,R,tube,y,o){const k=this.mesh(new T.TorusGeometry(R,tube,(o&&o.ts)||10,(o&&o.seg)||72),m,o);k.rotation.x=PI/2;k.position.y=y;return k;}
  bell(m,x,z,yTop,len,rT,rE,gcol,gk,throat){const pts=[];for(let i=0;i<=12;i++){const t=i/12;pts.push(new T.Vector2(rT+(rE-rT)*Math.sqrt(t),-t*len));}
    const k=this.mesh(new T.LatheGeometry(pts,24),m);k.material=m.clone();k.material.side=T.DoubleSide;k.position.set(x,yTop,z);this.bells.push({m:k.material,col:gcol,k:gk});
    if(throat){const h=new T.Mesh(new T.SphereGeometry(rT*1.9,12,8),new T.MeshBasicMaterial({color:throat}));h.position.set(x,yTop-rT*.6,z);h.visible=false;this.cur.add(h);this.plumes.push(h);}
    return k;}
  /* Optically thin exhaust expanding into vacuum: free cone from radius rE at half-angle deg, column brightness falling as (r0/r)^p.
     Three nested shells stand in for a density profile that peaks on the axis; the core shell can carry a hotter colour. */
  plume(col,core,I0,x,z,y,len,rE,deg,p){[[1,.3,col],[.6,.6,col],[.3,1,core]].forEach(q=>{const r0=rE*q[0],r1=r0+len*Math.tan(deg*q[0]*PI/180);
    const m=new T.ShaderMaterial({uniforms:{col:{value:new T.Color(q[2])},I0:{value:I0*q[1]},k:{value:(r1-r0)/r0},p:{value:p}},vertexShader:PV,fragmentShader:PF,
      transparent:true,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide});
    const k=new T.Mesh(new T.CylinderGeometry(r0,r1,len,40,1,true),m);k.position.set(x,y-len/2,z);k.visible=false;this.cur.add(k);this.plumes.push(k);});}
  turret(ang,rad,y,s){const p=new T.Group();p.rotation.y=ang;this.cur.add(p);const d=new T.Mesh(new T.SphereGeometry(s,12,8),mat.dark);d.position.set(rad,y,0);d.castShadow=true;p.add(d);
    const b=new T.Mesh(new T.CylinderGeometry(s*.14,s*.14,s*2.4,6),mat.dark);b.position.set(rad+s*.5,y+s*1.1,0);p.add(b);}
  sheet(col,yA,yB,xApex,yApex,n){ /* droplet sheet: generator boom on the spine, collector at the apex */
    const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute([0,yA,0, 0,yB,0, xApex,yApex,0],3));
    const s=new T.Mesh(g,glow(col,.13));this.cur.add(s);
    const v=[];for(let i=0;i<=n;i++){const y=yA+(yB-yA)*i/n;v.push(0,y,0,xApex,yApex,0);}
    const lg=new T.BufferGeometry();lg.setAttribute('position',new T.Float32BufferAttribute(v,3));
    this.cur.add(new T.LineSegments(lg,new T.LineBasicMaterial({color:col,transparent:true,opacity:.34,blending:T.AdditiveBlending,depthWrite:false})));
    const r=Math.abs(xApex)*.006+.6;this.strut(mat.steel,V(0,yA,0),V(xApex,yApex,0),r);this.strut(mat.steel,V(0,yB,0),V(xApex,yApex,0),r);
    this.box(mat.steel,r*8,r*14,r*5,xApex,yApex,0);}
  magNozzle(rings,nStruts,tube){rings.forEach(q=>this.ring(mat.coil,q[0],tube*(.6+.4*q[0]/rings[rings.length-1][0]),q[1]));
    for(let i=0;i<nStruts;i++){const a=i*2*PI/nStruts,c=Math.cos(a),s=Math.sin(a);
      for(let j=0;j<rings.length-1;j++){const p=rings[j],q=rings[j+1];this.strut(mat.steel,V(c*p[0],p[1],s*p[0]),V(c*q[0],q[1],s*q[0]),tube*.28);}
      this.strut(mat.steel,V(c*rings[0][0]*.5,rings[0][1]+rings[0][0]*1.2,s*rings[0][0]*.5),V(c*rings[0][0],rings[0][1],s*rings[0][0]),tube*.28);}}
  sub(fn){const g=new T.Group();this.cur.add(g);const prev=this.cur;this.cur=g;fn(g);this.cur=prev;return g;}
}

/* ---------- era 1: foil and truss ---------- */
function tug(){const s=new Ship();
  s.cyl(mat.dark,1,1,-.6,0,24); s.cyl(mat.white,2.2,1,-2.2,-.6); s.cyl(mat.white,2.2,2.2,-9,-2.2); s.cyl(mat.white,1.2,2.2,-10.5,-9);
  [-4,-7].forEach(y=>s.ring(mat.dark,2.22,.05,y));
  for(let i=0;i<4;i++){s.onSide(mat.dark,i*PI/2+PI/4,2.3,-8.3,.5,.6,.6);s.onSide(mat.dark,i*PI/2+PI/4,3.0,-41,.5,.6,.6);}
  s.truss(mat.alu,-24.5,-10.5,1.25,2.3,.07);
  s.strut(mat.alu,V(0,-12,1.2),V(0,-12,4.6),.07);const dish=s.mesh(new T.ConeGeometry(1.7,.7,24,1,true),mat.white.clone());dish.material.side=T.DoubleSide;dish.position.set(0,-12,5);dish.rotation.x=-PI/2;
  [1,-1].forEach(d=>{s.strut(mat.alu,V(d*1,-15,0),V(d*19.5,-15,0),.09);for(let i=0;i<4;i++)s.box(mat.solar,3.9,4.6,.06,d*(4.2+i*4.1),-15,0);});
  s.wing(mat.white,PI/2,1.3,5,-23,-18.5,.08);s.wing(mat.white,-PI/2,1.3,5,-23,-18.5,.08);
  s.sphere(mat.foil,2.5,0,-26.8,0,{crinkle:.035,seg:18,hs:12});
  s.capsule(mat.foil,3.1,-43.2,-29.4,0,0,{crinkle:.03});
  s.cyl(mat.alu,1.7,2.7,-44.6,-42.2,20);
  [1.25,-1.25].forEach(x=>{s.cyl(mat.dark,.35,.5,-45.2,-44.4,12,{x});s.bell(mat.dark,x,0,-45.1,2.8,.28,1.1,0xff4a12,.32);s.plume(0x8fb4ff,0xcfe0ff,.4,x,0,-47.9,16,1.1,42,2);});
  return s;}
function cutter(){const s=new Ship();
  s.cyl(mat.navy,3.7,3.7,3.2,3.45,8);for(let i=0;i<4;i++){const a=i*PI/2+PI/8;s.strut(mat.alu,V(Math.sin(a)*3.2,3.2,Math.cos(a)*3.2),V(Math.sin(a)*2.6,-4,Math.cos(a)*2.6),.07);}
  s.cyl(mat.navy,3,1,-5,0,8);s.cyl(mat.navy,3,3,-17,-5,8);s.cyl(mat.navy,1.6,3,-19,-17,8);
  s.cyl(mat.ochre,3.03,3.03,-6.6,-6,8,{open:true});
  s.turret(PI/2,2.9,-7.5,.7);s.turret(-PI/2,2.9,-14,.7);
  [0,PI].forEach(a=>{s.onSide(mat.armour,a,3.55,-12,1.5,7.5,2.1);s.onSide(mat.black,a,3.55,-8.2,1.2,.12,1.8);});
  s.strut(mat.alu,V(0,-16,2.6),V(0,-16,5.5),.06);s.box(mat.dark,.5,1.4,.5,0,-16,5.7);
  s.truss(mat.alu,-62.8,-19,1.6,3.1,.09);
  for(let i=0;i<4;i++){const a=PI/4+i*PI/2,x=Math.cos(a)*4.4,z=Math.sin(a)*4.4;s.capsule(mat.silverfoil,2.4,-46,-23.5,x,z,{crinkle:.025});
    [-27,-42].forEach(y=>s.strut(mat.alu,V(0,y,0),V(x*.5,y,z*.5),.1));}
  s.wing(mat.r600,0,1.8,9,-61,-49,.1);s.wing(mat.r600,PI,1.8,9,-61,-49,.1);
  s.cyl(mat.black,2.7,2.7,-64,-62.8,24);
  for(let i=0;i<3;i++){const a=i*2*PI/3,x=Math.cos(a)*1.55,z=Math.sin(a)*1.55;s.cyl(mat.dark,.75,.75,-68,-64,14,{x,z});s.bell(mat.dark,x,z,-68,5.5,.3,1.35,0xff4410,.28,0xfff0c8);}
  return s;}

/* ---------- era 2: plate and facet ---------- */
function frigate(){const s=new Ship();
  s.cyl(mat.dark,1.2,1.2,-1,1.8,16);s.cyl(mat.armour,11,1.6,-6.6,0,56);s.cyl(mat.armour,11,11,-46,-6.6,56);
  for(let y=-14;y>-46;y-=8)s.ring(mat.dark,11.0,.1,y,{shadow:false});
  s.cyl(mat.ochre,11.04,11.04,-11.4,-10.4,56,{open:true});
  for(let i=0;i<8;i++){s.onSide(mat.black,i*PI/4+PI/8,10.95,-22,.3,4.2,2.4);}

  for(let i=0;i<8;i++){const a=i*PI/4,x=Math.cos(a)*7,z=Math.sin(a)*7;s.cyl(mat.alu,.95,.95,-76,-66,12,{x,z});s.cyl(mat.mirror,.55,.55,-86,-76,10,{x,z});}

  const pts=[[0,-96.6],[13,-96.6],[17,-97.4],[17,-97.9],[12,-98.9],[0,-98.9]].map(p=>new T.Vector2(p[0],p[1]));
  const pp=s.mesh(new T.LatheGeometry(pts,64),mat.steel.clone());pp.material.side=T.DoubleSide;
  const face=s.cyl(mat.black,11.5,11.5,-99.0,-98.92,48);face.material=mat.black.clone();face.material.emissive=new T.Color(0xff6a20);face.material.emissiveIntensity=0;
  const f=new T.Mesh(new T.SphereGeometry(4.5,20,14),new T.MeshBasicMaterial({color:0xffffff}));f.position.y=-128;f.visible=false;s.g.add(f);
  const L=new T.SpotLight(0xfff2e0,0,0,1.3,.15,0);L.position.set(0,-128,0);L.target.position.set(0,-60,0);L.castShadow=true;L.shadow.mapSize.set(1024,1024);L.shadow.camera.near=4;L.shadow.camera.far=260;L.shadow.bias=-.002;s.g.add(L,L.target);

function cruiser(){const s=new Ship();
  s.cyl(mat.steel,.45,.45,0,19,6);s.cyl(mat.armourF,14,14,10,10.3,8);s.cyl(mat.armourF,14,14,18.6,18.9,8);
  s.cyl(mat.armourF,12,.6,-230,0,8);s.cyl(mat.armourF,12,12,-300,-230,8);
  for(let y=-40;y>-230;y-=38)s.cyl(mat.dark,12*(-y/230)+.6*(1+y/230)+.03,12*(-(y+.5)/230)+.6*(1+(y+.5)/230)+.03,y-.5,y,8,{open:true,shadow:false});
  s.sub(g=>{s.cyl(mat.belt,13.1,13.1,-272,-238,8);s.onSide(mat.ochre,PI/8+PI/2,12.15,-255,.2,30,2.2);s.spin.push({o:g,w:.9});});
  for(let i=0;i<4;i++){s.onSide(mat.black,i*PI/2+PI/8+PI/2,11.1,-287,.25,9,4.4);s.turret(i*PI/2+PI/8+PI/2,11.3,-226,1.3);}
  s.cyl(mat.armourF,6,12,-312,-300,8);s.cyl(mat.steel,3,3,-372,-312,12);
  for(let i=0;i<8;i++){const pv=[];for(let k=0;k<40;k++){const t=k/40*2*PI;pv.push(V(3+44*(1-Math.cos(t)),-342+28*Math.sin(t),0));}
    const k=s.mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pv,true),64,.75,5,true),mat.r1500,{shadow:false});k.rotation.y=i*PI/4;}

function torchLiner(){const s=new Ship();
  s.cyl(mat.armour,48,48,40,41.6,64);for(let i=0;i<4;i++){const a=i*PI/2+PI/4,c=Math.cos(a),z=Math.sin(a);s.strut(mat.steel,V(c*30,40,z*30),V(c*15,-34,z*15),.6);}
  s.cyl(mat.liner,18,6,-40,0,48);s.sphere(mat.liner,6,0,0,0);s.cyl(mat.liner,18,18,-150,-40,48);s.cyl(mat.liner,8,18,-172,-150,48);
  for(let y=-52;y>-150;y-=7)s.ring(mat.black,18.0,.22,y,{shadow:false,ts:6});
  for(let i=0;i<4;i++){const a=i*PI/2,x=Math.cos(a)*22.5,z=Math.sin(a)*22.5;s.capsule(mat.ochre,4,-146,-126,x,z);}

  s.sub(g=>{g.scale.set(1.6,1,.6);s.cyl(mat.ceramic,26,.5,-700,0,6);s.cyl(mat.ceramic,26,26,-1000,-700,6);s.cyl(mat.ceramic,10,26,-1060,-1000,6);});

  s.cyl(mat.r2500,10,10,-1260,-1060,32);

const SPEC=[
 {era:'Almost contemporary',style:'Foil and truss',key:'tug',ex:'Water vapour with spare hydrogen. Under-expanded in vacuum, so it fans out wide at the lip and is too thin to see beyond a few metres. The uncooled skirt glows.',build:tug,name:'Cislunar tug',cls:'Chemical · truss spine · integral tanks',drive:'Hydrolox, 2 expander bells',rad:'White body panels, ~300 K',crew:'4',
  look:'Hand-built hardware you could mistake for a 2030s programme. Crinkled gold MLI over cryo tanks, white-painted pressure can, solar wings, a bare aluminium truss. Nothing glows.'},
 {era:'Almost contemporary',style:'Foil and truss',key:'cutter',ex:'Hydrogen at 2,700 K is transparent and emits almost nothing visible, so there is no plume. You see the white-hot throat up the nozzle and the glowing skirt.',build:cutter,name:'Inspection cutter',cls:'Nuclear thermal · truss spine · faceted · drop tanks',drive:'3 solid-core NTR behind a shadow shield',rad:'Panel wings, ~600 K',crew:'6',
  look:'The first ship built to be shot at. Flat plates over a round can, one Whipple bumper on struts, box launchers, and a long truss whose only job is distance from the reactors.'},
 {era:'Pulse and early fusion',style:'Plate and facet',key:'frigate',ex:'One detonation per pulse unit, about 1 Hz, 30 m behind the plate. The plasma is gone in milliseconds; the flash is held for 50 ms here so it can be seen. Only what the plate does not shadow is lit.',build:frigate,name:'Pulse frigate',cls:'Orion · shell · round · envelope armour · spinal coilgun',drive:'Fission pulse units, pusher plate',rad:'C–C panels, ~1,000 K',crew:'30',
  look:'Shipyard steel. A blunt armoured drum riding two shock-absorber stages and a scorched plate. Panel seams, one ochre hull band, radiators tucked inside the plate’s shadow.'},
 {era:'Pulse and early fusion',style:'Plate and facet',key:'cruiser',ex:'Hydrogen plasma leaving the coils at about 17°. Thin and fading as 1/r², visible only near the nozzle. Pink from the Balmer lines where it recombines.',build:cruiser,name:'Lance cruiser',cls:'MCF fusion · shell · faceted lance · spun belt · 2 bumpers',drive:'Magnetic confinement fusion, magnetic nozzle',rad:'Tungsten wire loops, ~1,500 K',crew:'60',
  look:'A 2.8° armoured needle with nothing in the tip. The contra-rotating belt turns around the citadel. Eight orange wire loops are the first thing on this ship brighter than sunlight on paint.'},
 {era:'Torch era',style:'Filament and glow',key:'liner',ex:'Same physics with more power. A hot blue-white core, too ionised to emit lines, inside a cooler pink sheath. Longer because the flow is denser, not because it is collimated.',build:torchLiner,name:'Torch liner',cls:'Torch · truss spine · counter-rotating ring pair · lifeboats',drive:'Fusion torch, open coil nozzle',rad:'Tin droplet sheets, ~1,300 K',crew:'2,000 berths',

 {era:'Torch era',style:'Filament and glow',key:'blade',ex:'Almost fully ionised, so mostly faint blue-white continuum. A longer cage narrows it to about 12°. Most of the jet power leaves as light you cannot see.',build:blade,name:'Blade torchship',fresh:true,cls:'Late torch · shell · faceted + flat (hex blade) · radiating skin + droplet sheets',drive:'Late torch, 340 m open nozzle cage',rad:'Skin at ~2,500 K plus in-plane sheets',crew:'12',

];

/* ---------- scene ---------- */
const canvas=document.getElementById('stage');
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true,logarithmicDepthBuffer:true});}
catch(e){document.body.insertAdjacentHTML('beforeend','<div class="err">This browser could not start WebGL, so the models cannot be drawn.</div>');return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFShadowMap;
const scene=new T.Scene();scene.background=new T.Color(0x030405);
const cam=new T.PerspectiveCamera(32,1,1,1e5);
const sun=new T.DirectionalLight(0xfff6ea,1.08);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);sun.shadow.bias=-.0004;scene.add(sun,sun.target);
const amb=new T.AmbientLight(0x8fa2b8,.035);scene.add(amb);
const SUN=V(.55,.62,.56).normalize();
(function stars(){const n=1400,p=new Float32Array(n*3);for(let i=0;i<n;i++){const u=hash(i,1,2)*2-1,a=hash(i,3,4)*2*PI,r=Math.sqrt(1-u*u);p[i*3]=r*Math.cos(a);p[i*3+1]=u;p[i*3+2]=r*Math.sin(a);}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(p,3));
  const s=new T.Points(g,new T.PointsMaterial({color:0x8d949c,size:1.3,sizeAttenuation:false,transparent:true,opacity:.6,depthWrite:false}));s.name='stars';s.frustumCulled=false;scene.add(s);})();
const stars=scene.getObjectByName('stars');

const ships=SPEC.map(sp=>{const s=sp.build();
  const holder=new T.Group();s.g.rotation.z=-PI/2;holder.add(s.g);        /* nose to +X on screen */
  const box=new T.Box3();s.g.updateMatrixWorld(true);
  s.g.traverse(o=>{if(o.isMesh&&o.visible&&o.material.blending===T.NormalBlending)box.expandByObject(o);});
  const c=box.getCenter(V(0,0,0)),size=box.getSize(V(0,0,0));s.g.position.sub(c);
  holder.visible=false;scene.add(holder);
  return Object.assign(s,{spec:sp,holder,len:size.x,wid:Math.max(size.y,size.z),rad:size.length()/2});});

/* ---------- UI ---------- */
const rail=document.getElementById('rail'),card=document.getElementById('card'),tags=document.getElementById('tags');
const fmt=m=>m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m';
let lastEra=null,grp=null;const foot=document.createElement('div');
ships.forEach((s,i)=>{if(s.spec.era!==lastEra){lastEra=s.spec.era;grp=document.createElement('div');grp.className='grp';
    grp.innerHTML='<div class="era"><b>'+s.spec.era+'</b><span class="cap">'+s.spec.style+'</span></div>';rail.appendChild(grp);}
  const b=document.createElement('button');b.className='ship';b.id='ship-'+s.spec.key;b.setAttribute('aria-pressed','false');
  b.innerHTML='<span>'+s.spec.name+'</span><span class="mono">'+fmt(s.len)+'</span>';b.onclick=()=>{setLine(false);select(i,true);};grp.appendChild(b);s.btn=b;
  const t=document.createElement('div');t.className='tag';t.hidden=true;t.innerHTML='<b>'+s.spec.name+'</b> <span class="mono">'+fmt(s.len)+'</span>';tags.appendChild(t);s.tag=t;});
foot.className='foot';foot.textContent='Drag to orbit. Scroll or pinch to zoom. One sun, no fill, as in the style anchor.';rail.appendChild(foot);

const st={i:0,line:false,burn:false,turn:true,az:-.66,el:.3,dist:100,tgt:V(0,0,0),goal:null};
function fitDist(halfW,halfH){const vf=cam.fov*PI/360,hf=Math.atan(Math.tan(vf)*cam.aspect);const narrow=innerWidth<=820;
  return Math.max(halfW/Math.tan(hf)*(narrow?1.15:1.5),halfH/Math.tan(vf)*(narrow?2.4:1.5));}
function setSun(R,c){sun.target.position.copy(c);sun.position.copy(c).addScaledVector(SUN,R*3);const sc=sun.shadow.camera;
  sc.left=sc.bottom=-R*1.1;sc.right=sc.top=R*1.1;sc.near=R*.2;sc.far=R*6;sc.updateProjectionMatrix();sun.shadow.normalBias=R*.0012;}
function select(i,keepView){st.i=i;const s=ships[i];
  ships.forEach((q,k)=>{q.btn.setAttribute('aria-pressed',String(k===i&&!st.line));if(!st.line){q.holder.visible=k===i;q.holder.position.set(0,0,0);q.tag.hidden=true;}});
  const sp=s.spec;
  card.innerHTML='<div class="cap">'+sp.era+' · '+sp.style+'</div><h2>'+sp.name+'</h2><div class="cls">'+sp.cls+'</div>'+
    '<dl><dt>Length</dt><dd class="mono">'+fmt(s.len)+'</dd><dt>Widest span</dt><dd class="mono">'+fmt(s.wid)+'</dd><dt>Drive</dt><dd>'+sp.drive+'</dd><dt>Radiators</dt><dd>'+sp.rad+'</dd><dt>Crew</dt><dd class="mono">'+sp.crew+'</dd></dl>'+
    '<p'+(sp.fresh?' class="new"':'')+'>'+sp.look+'</p>'+(st.burn?'<p><span class="cap">Exhaust</span><br>'+sp.ex+'</p>':'')+'<p class="cap" style="margin-top:8px">Proportions by eye. No mass budget behind them.</p>';
  if(!st.line){setSun(s.rad,V(0,0,0));st.goal={dist:fitDist(s.len/2,s.wid/2),tgt:V(0,0,0)};if(!keepView){st.dist=st.goal.dist;}}}
function setLine(on){if(st.line===on)return;st.line=on;document.getElementById('t-line').setAttribute('aria-pressed',String(on));
  if(on){let z=0;const L=Math.max.apply(null,ships.map(s=>s.len));
    ships.forEach((s,k)=>{const w=Math.max(s.wid,L*.035);z+=w/2;s.holder.visible=true;s.holder.position.set(s.len/2-L/2,0,z);z+=w/2+L*.03;s.tag.hidden=false;s.btn.setAttribute('aria-pressed','false');});
    const c=V(0,0,z/2);setSun(Math.hypot(L,z)/2,c);st.goal={dist:fitDist(L/2,z/2)*1.3,tgt:c};st.az=.0001;st.el=1.05;}
  else{st.az=-.66;st.el=.3;select(st.i,true);}}
const tog=(id,fn)=>{const b=document.getElementById(id);b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));fn(on);};};
tog('t-burn',on=>{st.burn=on;ships.forEach(s=>{s.plumes.forEach(p=>p.visible=on);s.bells.forEach(b=>{if(b.col){b.m.emissive.set(on?b.col:0);b.m.emissiveIntensity=b.k;}});});select(st.i,true);});
tog('t-fill',on=>{amb.intensity=on?.5:.035;});
tog('t-turn',on=>{st.turn=on;});
document.getElementById('t-line').onclick=()=>setLine(!st.line);

/* ---------- camera: always centred on the object, drag orbits, wheel zooms logarithmically ---------- */
const ptr=new Map();let pinch=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);st.goal=st.goal&&{tgt:st.goal.tgt,dist:st.dist};});
canvas.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
  if(ptr.size===1){st.az-=(e.clientX-p[0])*.006;st.el=Math.max(-1.5,Math.min(1.5,st.el+(e.clientY-p[1])*.006));}
  ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch){st.dist*=pinch/d;if(st.goal)st.goal.dist=st.dist;}pinch=d;}});
const up=e=>{ptr.delete(e.pointerId);pinch=0;};canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();st.dist*=Math.exp(e.deltaY*.0012);if(st.goal)st.goal.dist=st.dist;},{passive:false});

const bar=document.getElementById('bar'),barlab=document.getElementById('barlab');
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!(w>0&&h>0))return false;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();return true;}
/* The view can be laid out at zero size (a hidden or collapsed panel). Never let that reach the camera maths. */
function refit(){if(!resize())return;if(st.line){st.line=false;setLine(true);}else select(st.i,true);}
addEventListener('resize',refit);if(window.ResizeObserver)new ResizeObserver(refit).observe(canvas);
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;if(still){st.turn=false;document.getElementById('t-turn').setAttribute('aria-pressed','false');}
let last=performance.now();const tmp=V(0,0,0);
function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(!(canvas.clientWidth>0&&canvas.clientHeight>0)){requestAnimationFrame(frame);return;}
  if(!(cam.aspect>0)||!(st.goal&&st.goal.dist>0)||!(st.dist>0)||!isFinite(st.tgt.x+st.tgt.y+st.tgt.z)){st.tgt.set(0,0,0);st.goal=null;refit();
    if(!(st.goal&&st.goal.dist>0)){requestAnimationFrame(frame);return;}st.dist=st.goal.dist;st.tgt.copy(st.goal.tgt);}
  if(st.goal){const k=1-Math.exp(-dt*5);st.dist+=(st.goal.dist-st.dist)*k;st.tgt.lerp(st.goal.tgt,k);}
  if(st.turn&&!st.line&&!ptr.size)st.az+=dt*.07;
  const ce=Math.cos(st.el);cam.position.set(st.tgt.x+st.dist*ce*Math.sin(st.az),st.tgt.y+st.dist*Math.sin(st.el),st.tgt.z+st.dist*ce*Math.cos(st.az));
  cam.near=st.dist/400;cam.far=st.dist*60;cam.updateProjectionMatrix();cam.lookAt(st.tgt);
  stars.position.copy(cam.position);stars.scale.setScalar(st.dist*30);
  ships.forEach(s=>{if(!s.holder.visible)return;if(!still)s.spin.forEach(q=>q.o.rotation.y+=q.w*dt);
    if(s.pulse){const P=s.pulse,on=st.burn,t=(now/1000)%1.1,live=on&&!still;P.light.intensity=live?16*Math.exp(-t/.035):0;P.flash.visible=live&&t<.05;
      P.plate.emissiveIntensity=on?(still?.5:1.5*Math.exp(-t/.2)+.06):0;}
    if(st.line){tmp.set(s.len/2,0,0).add(s.holder.position).project(cam);
      s.tag.style.transform='translate('+((tmp.x*.5+.5)*canvas.clientWidth+6)+'px,'+((-tmp.y*.5+.5)*canvas.clientHeight-8)+'px)';}});
  const mpp=2*st.dist*Math.tan(cam.fov*PI/360)/canvas.clientHeight;let n=Math.pow(10,Math.floor(Math.log10(mpp*130)));
  n=[5,2,1].map(k=>k*n).find(v=>v/mpp<=130)||n;bar.style.width=(n/mpp)+'px';barlab.textContent=fmt(n).replace('.00','');
  renderer.render(scene,cam);requestAnimationFrame(frame);}
resize();select(3,false);if(!(st.dist>0))st.dist=NaN;requestAnimationFrame(frame);
window.__bench={st,ships,select,setLine};
})();
</script>
