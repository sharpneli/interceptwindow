<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transfer planner window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Condensed:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06080a}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; background: #06080a">
  <dc-import name="Main" init-windows="transfer" init-focus="sun" init-select="tf-kestrel" init-log-d="9.0" init-pitch="0.75" init-yaw="-1.75" hint-size="1920px,1080px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
